server:
  # 8080 is deliberately avoided: an Oracle TNS listener commonly squats on it.
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: distributed-job-scheduler
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${scheduler.worker.group-id:job-workers}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.sidd.scheduler.api.dto
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.sidd.scheduler.api.dto.JobDtos$JobDispatchedEvent

scheduler:
  topics:
    ready: jobs.ready
    dlq: jobs.dlq
  dispatcher:
    enabled: ${DISPATCHER_ENABLED:true}
    poll-interval-ms: 500
    batch-size: 100
  retry:
    base-backoff-ms: 1000
    max-backoff-ms: 60000
  worker:
    id: ${WORKER_ID:worker-1}
    group-id: job-workers
    concurrency: ${WORKER_CONCURRENCY:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.sidd.scheduler: INFO
